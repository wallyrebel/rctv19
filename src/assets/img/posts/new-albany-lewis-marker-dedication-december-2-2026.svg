<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">New Albany historic marker dedication information</title>
  <desc id="desc">Original text graphic announcing the December 2, 2026 Meriwether Lewis historic marker dedication at the Tallahatchie River Bridge.</desc>
  <rect width="1200" height="630" fill="#173b49"/>
  <rect x="38" y="38" width="1124" height="554" rx="22" fill="#f5f0e4"/>
  <rect x="76" y="78" width="11" height="474" fill="#bd7944"/>
  <text x="120" y="145" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#52646a">UNION COUNTY · NEW ALBANY</text>
  <text x="120" y="240" font-family="Georgia,serif" font-size="62" font-weight="700" fill="#173b49">Meriwether Lewis</text>
  <text x="120" y="310" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#173b49">historic marker</text>
  <text x="120" y="385" font-family="Arial,sans-serif" font-size="37" fill="#173b49">Dedication · December 2, 2026 · 10 a.m.</text>
  <text x="120" y="452" font-family="Arial,sans-serif" font-size="32" fill="#52646a">Tallahatchie River Bridge, New Albany</text>
  <text x="120" y="531" font-family="Arial,sans-serif" font-size="22" fill="#52646a">RCTV 19 information graphic · source: Union County Heritage Museum</text>
</svg>
