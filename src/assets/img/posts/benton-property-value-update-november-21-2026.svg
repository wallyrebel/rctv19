<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Benton County property-value update</title>
  <desc id="desc">Original information graphic stating that Benton County's 2026 property-value update may affect tax bills. It is not an official notice or a photograph.</desc>
  <rect width="1200" height="630" fill="#112b37"/>
  <rect x="60" y="55" width="1080" height="520" rx="28" fill="#f4f2e9"/>
  <rect x="60" y="55" width="1080" height="18" fill="#cf9f4d"/>
  <text x="105" y="145" fill="#25475a" font-family="Arial, sans-serif" font-size="28" font-weight="700">BENTON COUNTY • 2026</text>
  <text x="105" y="240" fill="#112b37" font-family="Arial, sans-serif" font-size="58" font-weight="700">Property-value update</text>
  <text x="105" y="330" fill="#112b37" font-family="Arial, sans-serif" font-size="37">Assessments will be adjusted countywide.</text>
  <text x="105" y="392" fill="#112b37" font-family="Arial, sans-serif" font-size="37">Many owners may see higher tax bills.</text>
  <line x1="105" y1="440" x2="1095" y2="440" stroke="#cf9f4d" stroke-width="3"/>
  <text x="105" y="495" fill="#25475a" font-family="Arial, sans-serif" font-size="25">Source: Benton County Tax Office, via Tippah News</text>
  <text x="105" y="540" fill="#25475a" font-family="Arial, sans-serif" font-size="22">RCTV 19 information graphic • Not an official notice</text>
</svg>
