  <circle cx="1068" cy="330" r="19" fill="#f0bd58"/>
  <text x="80" y="397" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Union County</text>
  <text x="80" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">Library</text>
  <text x="475" y="397" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Main &amp; Bankhead</text>
  <text x="525" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">streets</text>
  <text x="900" y="397" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">County</text>
  <text x="900" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">Courthouse</text>
  <text x="80" y="533" fill="#f0bd58" font-family="Arial, sans-serif" font-size="31" font-weight="700">Community pep rally follows at the courthouse</text>
