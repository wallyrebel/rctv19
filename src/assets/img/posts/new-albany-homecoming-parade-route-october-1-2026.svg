<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">New Albany High School homecoming parade announcement</title>
  <desc id="desc">Thursday, October 1 at 6 p.m. The announced route starts at the Union County Library, travels on Main and Bankhead streets, and ends at the Union County Courthouse, followed by a community pep rally.</desc>
