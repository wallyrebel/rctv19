  <text x="80" y="165" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">New Albany homecoming parade</text>
  <text x="80" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="35">Thursday, Oct. 1 · 6 p.m.</text>
  <line x1="112" y1="330" x2="1080" y2="330" stroke="#f0bd58" stroke-width="8"/>
