<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Flood Watch for five north Mississippi counties</title>
  <desc id="desc">Information graphic listing Union, Prentiss, Alcorn, Benton and Tippah counties under a Flood Watch from late Friday night through Sunday morning, based on an October 8 National Weather Service Memphis bulletin.</desc>
  <rect width="1200" height="630" fill="#102b42"/>
  <rect x="0" y="0" width="18" height="630" fill="#5fc5e4"/>
  <text x="70" y="104" fill="#9fdced" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2">NORTH MISSISSIPPI WEATHER</text>
  <text x="70" y="203" fill="#ffffff" font-family="Arial, sans-serif" font-size="76" font-weight="700">FLOOD WATCH</text>
  <text x="70" y="262" fill="#ffffff" font-family="Arial, sans-serif" font-size="32">Late Friday night through Sunday morning</text>
  <line x1="70" y1="300" x2="1130" y2="300" stroke="#5fc5e4" stroke-width="3"/>
  <text x="70" y="368" fill="#9fdced" font-family="Arial, sans-serif" font-size="30" font-weight="700">COUNTIES IN THE RCTV 19 AREA</text>
  <text x="70" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="36">Union  •  Prentiss  •  Alcorn</text>
  <text x="70" y="484" fill="#ffffff" font-family="Arial, sans-serif" font-size="36">Benton  •  Tippah</text>
  <text x="70" y="564" fill="#c9dbe5" font-family="Arial, sans-serif" font-size="24">NWS Memphis bulletin • issued Oct. 8, 2026 at 12:13 p.m. CDT</text>
  <text x="1128" y="564" fill="#9fdced" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700">RCTV 19</text>
</svg>
