<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ripley First Monday Trade Day, December 5 and 6</title>
  <desc id="desc">RCTV 19 information graphic showing the reported December market dates, hours and location. Not a photograph.</desc>
  <rect width="1200" height="630" fill="#172a37"/>
  <rect x="55" y="50" width="1090" height="530" rx="18" fill="#f8f1df"/>
  <rect x="55" y="50" width="1090" height="15" fill="#b34d2b"/>
  <text x="100" y="128" fill="#a34427" font-family="Arial, sans-serif" font-size="28" font-weight="bold">RCTV 19  /  EVENT INFORMATION</text>
  <text x="100" y="215" fill="#172a37" font-family="Arial, sans-serif" font-size="61" font-weight="bold">Ripley First Monday</text>
  <text x="100" y="281" fill="#172a37" font-family="Arial, sans-serif" font-size="61" font-weight="bold">Trade Day</text>
  <line x1="100" y1="318" x2="1100" y2="318" stroke="#c5b8a0" stroke-width="3"/>
  <text x="100" y="390" fill="#172a37" font-family="Arial, sans-serif" font-size="37" font-weight="bold">DEC 5  ·  8 AM–5 PM</text>
  <text x="100" y="445" fill="#172a37" font-family="Arial, sans-serif" font-size="37" font-weight="bold">DEC 6  ·  8 AM–4 PM</text>
  <text x="100" y="520" fill="#4a565b" font-family="Arial, sans-serif" font-size="29">10590 Highway 15 South, Ripley</text>
  <text x="1090" y="555" text-anchor="end" fill="#6e7778" font-family="Arial, sans-serif" font-size="18">Information graphic · not a market photo</text>
</svg>
