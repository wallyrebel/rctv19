<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">East Union wins 2026 Class 2A volleyball championship</title>
  <desc id="desc">RCTV 19 information graphic reporting East Union's October 15 Class 2A state volleyball title and its 38-0 season. This is not a match photograph.</desc>
  <rect width="1200" height="630" fill="#10233c"/>
  <rect width="1200" height="17" fill="#e8b853"/>
  <text x="64" y="95" fill="#e8b853" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="3">THURSDAY, OCT. 15, 2026</text>
  <text x="64" y="202" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800">EAST UNION</text>
  <text x="64" y="288" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800">STATE CHAMPIONS</text>
  <rect x="64" y="328" width="530" height="76" rx="9" fill="#e8b853"/>
  <text x="90" y="381" fill="#10233c" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">CLASS 2A VOLLEYBALL</text>
  <text x="64" y="475" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">38–0 SEASON</text>
  <rect x="0" y="518" width="1200" height="112" fill="#173553"/>
  <text x="64" y="568" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25">Title: MHSAA • Record: Union County School District via Union County News</text>
  <text x="64" y="605" fill="#cbd8e5" font-family="Arial, Helvetica, sans-serif" font-size="22">Information graphic — no game photo shown</text>
  <text x="1136" y="605" text-anchor="end" fill="#e8b853" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">RCTV 19</text>
</svg>
