  <text x="80" y="502" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">Service updates: 662-728-6259</text>
  <path d="M80 538h1040" stroke="#f0d000" stroke-width="2" opacity=".75"/>
  <text x="80" y="579" fill="#ffffff" font-family="Arial, sans-serif" font-size="22">RCTV 19 INFORMATION GRAPHIC  ·  SOURCE: ALCORN COUNTY NEWS</text>
