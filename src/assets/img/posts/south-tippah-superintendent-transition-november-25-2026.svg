  <text x="105" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#435463">RCTV 19  |  TIPPAH COUNTY</text>
  <text x="105" y="240" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#142b3b">South TIPPAH leadership</text>
