<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Walnut-area scheduled power outage, November 6</title>
  <desc id="desc">Original information graphic: scheduled outage around 11 p.m. Friday, November 6, possibly lasting up to four hours. Not a photograph.</desc>
  <rect width="1200" height="630" fill="#102837"/>
  <rect x="54" y="54" width="1092" height="522" rx="22" fill="#f6f2e9"/>
  <rect x="54" y="54" width="1092" height="18" fill="#f1ba46"/>
  <text x="98" y="132" fill="#355262" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3">RCTV 19 • TIPPAH COUNTY</text>
  <text x="98" y="226" fill="#102837" font-family="Arial,sans-serif" font-size="62" font-weight="700">Walnut-area outage</text>
  <text x="98" y="297" fill="#102837" font-family="Arial,sans-serif" font-size="48">scheduled Friday night</text>
  <rect x="98" y="334" width="1004" height="112" rx="12" fill="#e5edf0"/>
  <text x="128" y="383" fill="#102837" font-family="Arial,sans-serif" font-size="37" font-weight="700">Nov. 6 • around 11 p.m.</text>
  <text x="128" y="426" fill="#355262" font-family="Arial,sans-serif" font-size="30">Could last up to four hours</text>
  <text x="98" y="509" fill="#355262" font-family="Arial,sans-serif" font-size="25">Check Tippah Electric Power Association for updates.</text>
  <text x="98" y="547" fill="#627b88" font-family="Arial,sans-serif" font-size="17">Original information graphic • not a photograph of the repair</text>
</svg>
