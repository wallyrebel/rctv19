  <text x="835" y="437" fill="#133b50" font-family="Arial,sans-serif" font-size="34">Hickory Flat 100</text>
  <text x="70" y="595" fill="#e6eef0" font-family="Arial,sans-serif" font-size="21">INFORMATION GRAPHIC • SOURCE: UNION COUNTY SPORTS</text>
