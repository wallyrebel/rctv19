  <text x="70" y="82" fill="#f5ca6c" font-family="Arial,sans-serif" font-size="30" font-weight="700">RCTV 19  •  UNION COUNTY SPORTS</text>
  <text x="70" y="166" fill="white" font-family="Arial,sans-serif" font-size="62" font-weight="700">MYRTLE BOYS WIN</text>
  <text x="70" y="237" fill="white" font-family="Arial,sans-serif" font-size="62" font-weight="700">PONTOTOC TITLE</text>
