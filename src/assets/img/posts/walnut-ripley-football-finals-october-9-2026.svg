<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Friday football finals: Walnut and Ripley</title>
  <desc id="desc">Biggersville defeated Walnut 16 to 6, and New Albany defeated Ripley 32 to 15 on October 9, 2026.</desc>
