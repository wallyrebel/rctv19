  <text x="90" y="180" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Friday football finals</text>
  <text x="90" y="222" fill="#bcd1dd" font-family="Arial, sans-serif" font-size="26">October 9, 2026</text>
  <line x1="90" y1="251" x2="1110" y2="251" stroke="#4d7183" stroke-width="2"/>
  <text x="90" y="316" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Biggersville</text>
