<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Corinth campaign rally recap, October 27, 2026</title>
  <desc id="desc">Original RCTV 19 information graphic stating that the October 26 campaign rally was held at Crossroads Arena in Corinth. Not a photograph of the event.</desc>
  <rect width="1200" height="630" fill="#142d31"/>
  <rect x="0" y="0" width="16" height="630" fill="#e69341"/>
  <rect x="60" y="45" width="166" height="37" rx="18" fill="#be5a29"/>
  <text x="143" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">RCTV 19</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">CORINTH, MISSISSIPPI</text>
  <text x="60" y="218" font-family="Arial, sans-serif" font-size="30" fill="#c8d6d2">Monday, October 26, 2026</text>
  <rect x="60" y="266" width="1080" height="216" rx="22" fill="#fffaf0"/>
  <text x="600" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#142d31">CAMPAIGN RALLY HELD</text>
  <text x="600" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#923c21">Crossroads Arena</text>
  <text x="60" y="545" font-family="Arial, sans-serif" font-size="21" fill="#e9f0ec">Post-event reporting confirmed the rally took place.</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="17" fill="#b7c9c3">Source: Mississippi Today  ·  Original information graphic, not an event photo</text>
