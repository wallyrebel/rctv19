<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Corinth homecoming Thursday schedule</title>
  <desc id="desc">RCTV 19 information graphic showing Corinth schools' October 15 early dismissal at 2 p.m. and homecoming parade at 5:30 p.m.</desc>
  <rect width="1200" height="630" fill="#172438"/>
  <rect width="1200" height="18" fill="#c83e47"/>
  <rect x="62" y="54" width="1076" height="500" rx="24" fill="#202f48" stroke="#5c6d83" stroke-width="2"/>
  <text x="105" y="124" fill="#f68b8f" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="4">CORINTH HOMECOMING WEEK</text>
  <text x="105" y="209" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800">THURSDAY, OCT. 15</text>
  <line x1="105" y1="244" x2="1094" y2="244" stroke="#7a899b" stroke-width="2"/>
  <text x="105" y="331" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">2 P.M.</text>
  <text x="383" y="331" fill="#e8edf4" font-family="Arial, Helvetica, sans-serif" font-size="38">All schools dismiss early</text>
  <text x="105" y="427" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">5:30 P.M.</text>
  <text x="435" y="427" fill="#e8edf4" font-family="Arial, Helvetica, sans-serif" font-size="38">Homecoming parade</text>
  <text x="106" y="511" fill="#afbdce" font-family="Arial, Helvetica, sans-serif" font-size="26">Schedule: Corinth School District Weekly Warrior</text>
  <text x="1095" y="594" text-anchor="end" fill="#f68b8f" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">RCTV 19</text>
</svg>
