  <text x="88" y="504" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10243b">Wednesday garbage pickup → Thursday</text>
  <text x="88" y="558" font-family="Arial,sans-serif" font-size="20" fill="#586b7d">Scheduled events and service change • Information graphic, not an event photo</text>
