<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">New Albany Thanksgiving garbage pickup change</title>
  <desc id="desc">RCTV 19 information graphic: Thursday and Friday routes move to Wednesday, November 25, 2026.</desc>
  <rect width="1200" height="630" fill="#102b39"/>
  <rect x="54" y="52" width="1092" height="526" rx="22" fill="#f6f4e9"/>
  <rect x="54" y="52" width="1092" height="110" rx="22" fill="#0b665d"/>
  <text x="93" y="120" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">RCTV 19  |  NEW ALBANY</text>
  <text x="92" y="242" fill="#102b39" font-family="Arial,sans-serif" font-size="52" font-weight="700">Thanksgiving garbage pickup</text>
  <text x="92" y="334" fill="#102b39" font-family="Arial,sans-serif" font-size="41">Thursday and Friday routes</text>
  <text x="92" y="415" fill="#0b665d" font-family="Arial,sans-serif" font-size="52" font-weight="700">Wednesday, Nov. 25</text>
  <line x1="92" y1="456" x2="1108" y2="456" stroke="#b7c8c7" stroke-width="3"/>
  <text x="92" y="517" fill="#3c5260" font-family="Arial,sans-serif" font-size="26">Original information graphic • Source: City of New Albany</text>
</svg>
