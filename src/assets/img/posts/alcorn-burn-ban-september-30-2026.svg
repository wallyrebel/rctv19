<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Alcorn County outdoor burn ban</title>
  <desc id="desc">RCTV 19 information graphic. Alcorn County's outdoor burn ban was issued September 28 and is scheduled through October 12 unless lifted sooner.</desc>
  <rect width="1200" height="630" fill="#172c34"/>
  <rect width="24" height="630" fill="#eead4b"/>
  <text x="70" y="92" fill="#eead4b" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3">ALCORN COUNTY · SEPT. 30 REPORT</text>
  <text x="70" y="193" fill="#fff" font-family="Arial, sans-serif" font-size="70" font-weight="700">OUTDOOR BURN BAN</text>
  <line x1="70" y1="221" x2="1130" y2="221" stroke="#eead4b" stroke-width="4"/>
  <text x="70" y="319" fill="#fff" font-family="Arial, sans-serif" font-size="47" font-weight="700">Issued Sept. 28</text>
  <text x="70" y="388" fill="#eead4b" font-family="Arial, sans-serif" font-size="54" font-weight="700">Scheduled through Oct. 12</text>
  <text x="70" y="449" fill="#d7e2e4" font-family="Arial, sans-serif" font-size="29">Unless county officials lift it sooner</text>
  <rect x="70" y="495" width="1060" height="70" rx="12" fill="#2b4650"/>
  <text x="99" y="540" fill="#fff" font-family="Arial, sans-serif" font-size="26">Check the current county order before outdoor burning</text>
  <text x="70" y="606" fill="#c3d0d3" font-family="Arial, sans-serif" font-size="20">RCTV 19 ORIGINAL GRAPHIC · SOURCE: ALCORN COUNTY NEWS</text>
</svg>
