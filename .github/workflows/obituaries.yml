name: Daily Obituaries

on:
  schedule:
    # 7:00 AM and 4:00 PM CDT (12:00 and 21:00 UTC)
    - cron: '0 12,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obituary-publishing
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sources still behind bot protection are reported and skipped; a blocked
      # source is a known condition, not a failed run. See docs/obituaries.md.
      - name: Fetch obituaries
        run: node scripts/fetch-obituaries.js --apply

      - name: Test and build before publishing
        run: |
          npm test
          npm run build

      - name: Commit and push if changes exist
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/obituaries scripts/published_obituaries.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Publish new obituaries from local funeral homes" && git push)
