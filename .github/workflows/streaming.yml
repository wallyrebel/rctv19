name: Validate streaming apps

on:
  push:
    paths:
      - 'streaming/**'
      - '.github/workflows/streaming.yml'
  pull_request:
    paths:
      - 'streaming/**'
      - '.github/workflows/streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: streaming/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test streaming logic
        run: npm test
      - name: Validate shared catalog
        run: npm run check:catalog
      - name: Build watch website
        run: npm run build:web
      - name: Compile Roku app
        run: npm run build:roku
      - name: Test Roku deep-link routing
        run: npm exec --yes --package=brs@0.45.0 -- brs apps/roku/components/DeepLink.brs tests/roku-deep-link.brs
